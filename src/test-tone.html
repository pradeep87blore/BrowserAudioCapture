<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test tone</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10261c;
      color: #d8ffe8;
      font: 28px/1.3 "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <p id="label">Starting tone…</p>
  <script>
    let started = false
    async function startTone() {
      if (started) return 'running'
      started = true
      const ctx = new AudioContext({ sampleRate: 48000 })
      await ctx.resume()
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.frequency.value = 440
      gain.gain.value = 0.25
      osc.connect(gain).connect(ctx.destination)
      osc.start()
      document.getElementById('label').textContent = 'Tone playing'
      return ctx.state
    }
    window.__toneReady = startTone()
    document.body.addEventListener('pointerdown', () => { void startTone() })
  </script>
</body>
</html>
