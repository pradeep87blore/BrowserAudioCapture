<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser Audio Capture</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="chrome">
    <div class="row">
      <button id="back" class="icon-btn" type="button" aria-label="Back" title="Back (Alt+Left)" disabled>←</button>
      <button id="forward" class="icon-btn" type="button" aria-label="Forward" title="Forward (Alt+Right)" disabled>→</button>
      <button id="reload" class="icon-btn" type="button" aria-label="Reload" title="Reload">↻</button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address" />
    </div>
    <div class="row">
      <button id="record" type="button" aria-label="Record" title="Record browser audio (F9)">
        <span class="record-icon"></span>
      </button>
      <button id="mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute browser audio" title="Mute this browser. Recording still captures the page.">
        <svg class="icon-on" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M2.5 6.2h2.1L8 3.4v9.2L4.6 9.8H2.5V6.2z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M10 6.3a2.6 2.6 0 0 1 0 3.4M11.5 4.7a4.6 4.6 0 0 1 0 6.6"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M2.5 6.2h2.1L8 3.4v9.2L4.6 9.8H2.5V6.2z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M10.2 6.2l3.6 3.6M13.8 6.2l-3.6 3.6"/>
        </svg>
      </button>
      <span id="timer" class="timer">0:00</span>
      <div class="meter" aria-hidden="true"><div id="meter-fill"></div></div>
      <span id="status" class="status" aria-live="polite">Play audio in the page, then press Record.</span>
      <label class="switch" title="Stop recording after 60 seconds with no browser audio">
        <input id="silence-stop" type="checkbox" checked />
        <span class="track"></span>
        <span class="switch-label">Stop after 1 min silence</span>
      </label>
      <button id="folder" class="text-btn" type="button">Open folder</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
